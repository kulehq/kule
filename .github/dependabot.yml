version: 2
# Version updates wait a week after a release (cooldown), so one published
# and pulled within days never reaches a pull request; security updates
# are not held back.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
