name: docs

# Builds the documentation site (website/, from the pages in docs/) in
# English and Turkish, and on main publishes it to GitHub Pages:
# https://kulehq.github.io/kule/
#
# The build runs third-party code (npm packages) and sees no credential:
# installing skips every package's scripts, and only the deploy job may
# write to Pages or mint the token Pages asks for.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install, as the lockfile says, running no package's scripts
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build both languages (fails on a broken link or anchor)
        working-directory: website
        run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  # The installer the site serves (website/static/install.sh): shellcheck,
  # its tests on a stand-in release, and the newest real release installed
  # into a temporary home, with its build provenance checked (GH_TOKEN signs
  # the GitHub CLI in for that alone).
  install-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh website/static/install.sh website/test-install.sh
      - name: Tests, and the newest release installed
        env:
          KULE_TEST_ONLINE: "1"
          GH_TOKEN: ${{ github.token }}
        run: sh website/test-install.sh

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, install-script]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
