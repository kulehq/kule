name: release

# A tag vX.Y.Z builds the macOS app (universal), the Linux .deb and .rpm
# and the Windows installer (x64 and ARM64), each with the kule CLI inside,
# and opens a draft release with them, their checksums, an SBOM of each
# and build provenance attestations.
#
# The macOS app is signed ad hoc, never notarized, and the Windows files
# are not signed; the notes of every release say how to check a download
# and open it. No job holds a secret.
# Publishing is a job of its own in the `release` environment, which waits
# for a maintainer's approval: nothing reaches even the draft before it.
# Run by hand, it builds and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: 2.11.5
  CYCLONEDX_VERSION: 0.5.9
  CARGO_TERM_COLOR: never

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the version being built
        id: version
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$IS_TAG" = "true" ] && [ "${TAG#v}" != "$version" ]; then
            echo "Cargo.toml is not at ${TAG#v}"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (rust-toolchain.toml), for both architectures
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Tauri CLI, and cargo-auditable at the version the gate pins
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          cargo install cargo-auditable --version "$(sed -n 's/^CARGO_AUDITABLE=//p' scripts/release-gate.sh)" --locked
      # Each with its dependency tree inside (cargo-auditable), which the
      # gate audits and anyone can read back.
      - name: The kule CLI for both architectures, as one binary
        run: |
          cargo auditable build --release --locked -p kule --target aarch64-apple-darwin
          cargo auditable build --release --locked -p kule --target x86_64-apple-darwin
          # Tauri builds each architecture apart, then the universal app:
          # each build looks for the CLI of its own.
          bin=crates/kule-desktop/binaries
          mkdir -p "$bin"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do cp "target/$t/release/kule" "$bin/kule-$t"; done
          lipo -create -output "$bin/kule-universal-apple-darwin" "$bin/kule-aarch64-apple-darwin" "$bin/kule-x86_64-apple-darwin"
      - name: Build, signed ad hoc
        working-directory: crates/kule-desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          cargo tauri build --target universal-apple-darwin --bundles app,dmg \
            --config tauri.release.conf.json
      - name: Check what was built
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Kule.app"
          "$app/Contents/MacOS/kule" --version
          lipo -archs "$app/Contents/MacOS/kule-desktop" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/kule-desktop" | grep -q x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"
          mkdir dist
          cp "$bundle"/dmg/*.dmg "dist/Kule_${VERSION}_universal.dmg"
          tar -C "$app/Contents/MacOS" -czf "dist/kule-$VERSION-macos-universal.tar.gz" kule
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu, so the .deb runs on the glibc it has.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Desktop app dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Tauri CLI, and cargo-auditable at the version the gate pins
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          cargo install cargo-auditable --version "$(sed -n 's/^CARGO_AUDITABLE=//p' scripts/release-gate.sh)" --locked
      - name: The kule CLI, with its dependency tree inside (cargo-auditable)
        run: |
          cargo auditable build --release --locked -p kule
          mkdir -p crates/kule-desktop/binaries
          cp target/release/kule crates/kule-desktop/binaries/kule-x86_64-unknown-linux-gnu
      # A pre-release (0.2.0-preview.1) must sort before its release in
      # each package manager, which neither reads SemVer's `-` that way:
      # the .rpm is 0.2.0 with release 0.preview.1 (Fedora's way), the .deb
      # 0.2.0~preview.1. A release is its version in both.
      - name: Versions the package managers read
        id: pkg
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          base=${version%%-*}
          case "$version" in
            *-*)
              pre=${version#*-}
              case "$pre" in *[!A-Za-z0-9.]*) echo "pre-release $pre: only letters, digits and dots"; exit 1 ;; esac
              echo "config={\"version\":\"$base\",\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"0.$pre\"}}}}" >> "$GITHUB_OUTPUT"
              echo "deb=$base~$pre" >> "$GITHUB_OUTPUT"
              echo "rpm=$base-0.$pre" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "config={}" >> "$GITHUB_OUTPUT"
              echo "deb=$version" >> "$GITHUB_OUTPUT"
              echo "rpm=$version-1" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Build the .deb and the .rpm
        working-directory: crates/kule-desktop
        env:
          PACKAGE_CONFIG: ${{ steps.pkg.outputs.config }}
        run: cargo tauri build --bundles deb,rpm --config tauri.release.conf.json --config "$PACKAGE_CONFIG"
      - name: Name them, and give the .deb its version
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          BASE: ${{ steps.pkg.outputs.base }}
          DEB_VERSION: ${{ steps.pkg.outputs.deb }}
        run: |
          set -eu
          mkdir dist
          deb=$(ls target/release/bundle/deb/*.deb)
          rpm=$(ls target/release/bundle/rpm/*.rpm)
          work="$RUNNER_TEMP/deb"
          dpkg-deb -R "$deb" "$work"
          sed -i "s/^Version: .*/Version: $DEB_VERSION/" "$work/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$work" "dist/Kule_${VERSION}_amd64.deb"
          cp "$rpm" "dist/Kule-${VERSION}.x86_64.rpm"
          test "$(dpkg-deb -f "dist/Kule_${VERSION}_amd64.deb" Version)" = "$DEB_VERSION"
          if [ "$VERSION" != "$BASE" ]; then
            dpkg --compare-versions "$DEB_VERSION" lt "$BASE"
          fi
      - name: Install each where it belongs
        env:
          RPM_VERSION: ${{ steps.pkg.outputs.rpm }}
        run: |
          # Ubuntu, from the .deb.
          sudo apt-get install -y ./dist/*.deb
          kule --version
          test -x /usr/bin/kule-desktop
          # Fedora, from the .rpm, with the libraries it names.
          docker run --rm -e RPM_VERSION -v "$PWD/dist:/dist:ro" \
            fedora@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            sh -c 'set -e; test "$(rpm -qp --qf "%{VERSION}-%{RELEASE}" /dist/*.rpm)" = "$RPM_VERSION"
                   dnf install -y -q /dist/*.rpm && kule --version && test -x /usr/bin/kule-desktop'
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tar -C target/release -czf "dist/kule-$version-linux-x86_64.tar.gz" kule
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  # The Windows app and CLI, for x64 and for ARM64, each on a runner of its
  # architecture, with the two programs the CLI starts beside itself: the
  # task's proxy and the terminal's helper. The NSIS installer installs for
  # the user who runs it, no administrator asked; the bundler fetches NSIS
  # at the version and hash the pinned Tauri CLI names. Nothing is signed.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the version being built
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$IS_TAG" = "true" ] && [ "${TAG#v}" != "$version" ]; then
            echo "Cargo.toml is not at ${TAG#v}"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (rust-toolchain.toml) and the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Tauri CLI, and cargo-auditable at the version the gate pins
        shell: bash
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          cargo install cargo-auditable --version "$(sed -n 's/^CARGO_AUDITABLE=//p' scripts/release-gate.sh)" --locked
      - name: The kule CLI, the proxy and the terminal helper, each with its dependency tree inside
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo auditable build --release --locked --target "$TARGET" -p kule -p kule-proxy -p kule-pty-helper
          bin=crates/kule-desktop/binaries
          mkdir -p "$bin"
          for name in kule kule-proxy kule-pty-helper; do
            cp "target/$TARGET/release/$name.exe" "$bin/$name-$TARGET.exe"
          done
      - name: Build the installer
        working-directory: crates/kule-desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo tauri build --target "$TARGET" --bundles nsis \
            --config tauri.release.conf.json --config tauri.windows-release.conf.json
      # Installed silently for this user, then the installed programs are
      # checked: the CLI says its version, and the two it starts beside
      # itself are there, or no task's proxy and no terminal would start.
      - name: Check what was built, and install it
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          release="target/$TARGET/release"
          "$release/kule.exe" --version | grep -F "$VERSION"
          setup=$(ls "$release"/bundle/nsis/*-setup.exe)
          cmd //c start "" //wait "$(cygpath -w "$setup")" //S
          installed="$LOCALAPPDATA/Kule"
          test -f "$installed/kule-desktop.exe"
          for name in kule kule-proxy kule-pty-helper; do
            test -f "$installed/$name.exe"
          done
          "$installed/kule.exe" --version | grep -F "$VERSION"
          mkdir dist
          cp "$setup" "dist/Kule_${VERSION}_${ARCH}-setup.exe"
      - name: The CLI and its two programs, as one archive
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          $release = "target/$env:TARGET/release"
          Compress-Archive -Path "$release/kule.exe", "$release/kule-proxy.exe", "$release/kule-pty-helper.exe" `
            -DestinationPath "dist/kule-$env:VERSION-windows-$env:ARCH.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # What the CLI and the app are made of, every platform's crates included,
  # as CycloneDX: read from Cargo.lock, nothing built.
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo-cyclonedx, at a pinned version
        run: cargo install --locked cargo-cyclonedx --version "$CYCLONEDX_VERSION"
      - name: An SBOM for the CLI and one for the app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir dist
          for crate in kule-cli kule-desktop; do
            cargo cyclonedx --manifest-path "crates/$crate/Cargo.toml" --format json \
              --spec-version 1.5 --target all --override-filename sbom -q
            test -s "crates/$crate/sbom.json"
          done
          mv crates/kule-cli/sbom.json "dist/kule-$version.cdx.json"
          mv crates/kule-desktop/sbom.json "dist/kule-desktop-$version.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/
          if-no-files-found: error

  # The kule CLI as it is about to be published, on each platform: the
  # crates inside it against the advisories, what a command in a task can
  # reach, under sandbox-probe, and real projects installed, built and
  # tested in a task (scripts/release-gate.sh). It runs their code and the
  # probe's in the sandbox, holding nothing.
  gate:
    needs: [macos, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact: macos
            archive: macos-universal
          - os: ubuntu-24.04
            artifact: linux
            archive: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: The kule CLI from the release's archive
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          mkdir -p "$RUNNER_TEMP/kule"
          tar -C "$RUNNER_TEMP/kule" -xzf "dist/kule-$version-$ARCHIVE.tar.gz" kule
          "$RUNNER_TEMP/kule/kule" --version
      - name: Rust toolchain (rust-toolchain.toml), for cargo-audit
        run: rustup toolchain install
      - name: The crates inside it, against the advisories
        run: |
          cargo install cargo-audit --version "$(sed -n 's/^CARGO_AUDIT=//p' scripts/release-gate.sh)" --locked
          KULE="$RUNNER_TEMP/kule/kule" scripts/release-gate.sh binary
      - name: Unprivileged user namespaces (the sandbox's own network)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What a command in a task can reach, under sandbox-probe
        run: |
          go install github.com/controlplaneio/sandbox-probe/v6@v6.19.1
          PATH="$(go env GOPATH)/bin:$PATH"
          KULE="$RUNNER_TEMP/kule/kule" scripts/release-gate.sh probe
      - name: Real projects install, build and test in a task
        run: KULE="$RUNNER_TEMP/kule/kule" scripts/release-gate.sh project

  # The Windows CLI as it is about to be published, and the two programs
  # it starts: the crates inside each against the advisories, and a real
  # command in a task's container, on a Windows 11 runner (the Windows
  # Server runner cannot make the container), for x64 under Windows's own
  # emulation and for ARM64. sandbox-probe and the real projects run on
  # the Windows test machine, by hand, before a release.
  gate-windows:
    needs: [windows]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: dist
      - name: The kule CLI from the release's archive
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Expand-Archive -Path "dist/kule-$version-windows-$env:ARCH.zip" -DestinationPath "$env:RUNNER_TEMP/kule"
          & "$env:RUNNER_TEMP/kule/kule.exe" --version
      - name: Rust toolchain (rust-toolchain.toml), for cargo-audit
        shell: bash
        run: rustup toolchain install
      - name: The crates inside each program, against the advisories
        shell: bash
        run: |
          cargo install cargo-audit --version "$(sed -n 's/^CARGO_AUDIT=//p' scripts/release-gate.sh)" --locked
          for name in kule kule-proxy kule-pty-helper; do
            KULE="$RUNNER_TEMP/kule/$name.exe" scripts/release-gate.sh binary
          done
      - name: A command runs in a task's container, through this CLI
        shell: bash
        env:
          KULE_HOME: ${{ runner.temp }}/kule-home
          # Else bash on Windows turns cmd's /c and /d into drive paths.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -eu
          kule="$RUNNER_TEMP/kule/kule.exe"
          ws="$RUNNER_TEMP/ws"
          mkdir -p "$ws" && echo hello > "$ws/README.md"
          task=$("$kule" new "$ws" | sed -n 's/^task \([0-9a-f]*\) .*/\1/p')
          test -n "$task"
          outside="$(cygpath -w "$RUNNER_TEMP")\\escaped.txt"
          "$kule" exec "$task" -- cmd /d /c "echo inside > inside.txt && type inside.txt"
          "$kule" exec "$task" -- cmd /d /c "echo x > \"$outside\"" && { echo "wrote outside the task"; exit 1; }
          test ! -f "$RUNNER_TEMP/escaped.txt"
          "$kule" status "$task"

  publish:
    # A tag that was pushed, never a run by hand.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows, sbom, gate, gate-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # It waits for a maintainer's approval. Only this job may mint an OIDC
    # token (for the attestations): it builds nothing and runs no
    # dependency's code.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{macos,linux,windows-x64,windows-arm64,sbom}"
          path: dist
          merge-multiple: true
      - name: Checksums and the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test -f "dist/Kule_${version}_universal.dmg"
          test -f "dist/kule-$version-macos-universal.tar.gz"
          for arch in x64 arm64; do
            test -f "dist/Kule_${version}_${arch}-setup.exe"
            test -f "dist/kule-$version-windows-$arch.zip"
          done
          test -s "dist/kule-$version.cdx.json"
          test -s "dist/kule-desktop-$version.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS)
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > changes.md
          test -s changes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          sed "s/@VERSION@/$version/g" packaging/release-notes.md > notes.md
          cat changes.md >> notes.md
      - name: Build provenance for every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # A version with `-` (0.2.0-preview.1) is a pre-release: GitHub never
      # shows it as the latest one.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=
          case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $pre --verify-tag \
            --title "Kule ${TAG#v}" --notes-file notes.md dist/*
