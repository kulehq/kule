name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, on main, with nothing changed: the sandbox rests on what each
  # operating system provides, and a runner image that moves to a new
  # macOS, kernel or Windows build would otherwise show at the next
  # commit, after people met it on their own computers. A failure opens
  # an issue (the `report` job).
  schedule:
    - cron: "17 5 * * 1"
  # By hand, for one platform: to look into a failure on one of them
  # without running the others. A pull request still runs them all.
  workflow_dispatch:
    inputs:
      os:
        description: Which platform's tests to run
        type: choice
        default: windows-latest
        options: [ubuntu-latest, macos-latest, windows-latest, ubuntu-26.04, all]

permissions:
  contents: read

jobs:
  # Whether the change touches anything but documentation
  # (scripts/ci-changes.sh holds the list, deny by default). For a pull
  # request or a push that is documentation only, the required jobs below
  # still run under their own names, with their steps skipped; anything
  # else, a scheduled run and one started by hand run everything. Those
  # jobs run even when this one fails (`!cancelled()`), and their steps
  # are skipped only on an explicit `false`, so a failure here runs them
  # all. Kept in step with MAINTAINING.md.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            scripts/ci-changes.sh "$BASE" "$HEAD"
          else
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
          fi

  # What Kule depends on: advisories, licences, duplicate and wildcard
  # versions, and where crates come from (deny.toml); and osv-scanner over
  # every lockfile, the docs site's included (the release gate's `deps`).
  deny:
    needs: changes
    # Not for a one-platform look: it checks what Kule depends on, not a platform.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code != 'false'
        run: rustup toolchain install
      - name: cargo-deny, at a pinned version
        if: needs.changes.outputs.code != 'false'
        run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check
        if: needs.changes.outputs.code != 'false'
      # osv-scanner 2.6.0 needs Go 1.27 or later.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code != 'false'
        with:
          go-version: "1.27.3"
          cache: false
      - name: osv-scanner over the lockfiles (scripts/release-gate.sh)
        if: needs.changes.outputs.code != 'false'
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          PATH="$(go env GOPATH)/bin:$PATH"
          scripts/release-gate.sh deps

  # The workflows themselves: expressions, shell steps and runner labels
  # (actionlint); injection, kept credentials, caches and pins (zizmor).
  workflows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: actionlint and zizmor, at the versions the gate pins
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          cargo install --locked zizmor --version 1.30.1
      - name: Check the workflows (scripts/release-gate.sh)
        env:
          # zizmor's online audits ask GitHub whether each pin is real.
          GH_TOKEN: ${{ github.token }}
        run: |
          PATH="$(go env GOPATH)/bin:$PATH"
          scripts/release-gate.sh workflows

  # The three `-latest` images are the required checks. The newest image
  # GitHub offers beside them runs too, so a change shows before the
  # label moves to it; it is not required (MAINTAINING.md says what to do
  # when it fails). Today that is Ubuntu 26.04: macos-latest is already
  # macOS 26 and windows-latest Windows Server 2025, the newest of each.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.os != 'all') && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest", "ubuntu-26.04"]') }}
    runs-on: ${{ matrix.os }}
    # A test that hangs ends the run here, not after GitHub's six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code != 'false'
        run: rustup toolchain install
      - name: Desktop app dependencies (WebKitGTK)
        if: needs.changes.outputs.code != 'false' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Unprivileged user namespaces (the sandbox's own network)
        if: needs.changes.outputs.code != 'false' && (runner.os == 'Linux')
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo fmt --all --check
        if: needs.changes.outputs.code != 'false'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: needs.changes.outputs.code != 'false'
      - run: cargo test --workspace --locked
        if: needs.changes.outputs.code != 'false'
      # The release gate's scripts are bash and run commands in a sandbox:
      # on Windows the sandbox arrives with a later work package, and the
      # gate runs on the Windows test machine until then.
      # Go for betterleaks below: the macOS runner image no longer has it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code != 'false' && (runner.os != 'Windows')
        with:
          go-version: "1.26.10"
          cache: false
      - name: Canary secrets stay out of a task (scripts/release-gate.sh)
        if: needs.changes.outputs.code != 'false' && (runner.os != 'Windows')
        run: |
          go install github.com/betterleaks/betterleaks@v1.9.0
          PATH="$(go env GOPATH)/bin:$PATH"
          cargo build --locked -p kule
          scripts/release-gate.sh canary
      - name: What a command in a task can reach, under sandbox-probe (scripts/release-gate.sh)
        if: needs.changes.outputs.code != 'false' && (runner.os != 'Windows')
        run: |
          go install github.com/controlplaneio/sandbox-probe/v6@v6.19.1
          PATH="$(go env GOPATH)/bin:$PATH"
          scripts/release-gate.sh probe
      # Node for commander below, which needs 22.12 or later.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.code != 'false' && (runner.os != 'Windows')
        with:
          node-version: 24
          package-manager-cache: false
      - name: The window's Markdown renderer (node --test, no packages)
        if: needs.changes.outputs.code != 'false' && (runner.os != 'Windows')
        run: node --test crates/kule-desktop/ui/tests/*.test.js
      - name: Real projects install, build and test in a task (scripts/release-gate.sh)
        if: needs.changes.outputs.code != 'false' && (runner.os != 'Windows')
        run: scripts/release-gate.sh project
      - name: Weaker isolation runs only once accepted (user namespaces refused)
        if: needs.changes.outputs.code != 'false' && (runner.os == 'Linux')
        env:
          KULE_TEST_EXPECT_GAPS: "1"
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          else
            sudo sysctl -w user.max_user_namespaces=0
          fi
          cargo test -p kule-engine --locked --test sandbox weaker_isolation

  # Mutation tests on what the change touches (cargo-mutants, pinned;
  # .cargo/mutants.toml): each function the diff changed is altered in
  # turn, and a test must fail for every alteration. Only the diff's
  # mutants, split over four shards on macOS and on Linux, so a round
  # stays within the cap. A mutant in code one platform compiles out is
  # missed there and caught on the other, so these jobs fail on nothing
  # but their own errors: `mutants-report` joins the shards and fails on
  # a mutant missed everywhere. Pull requests and pushes only: a
  # scheduled run or one started by hand has no diff.
  mutants:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code != 'false'
        run: rustup toolchain install
      - name: Desktop app dependencies (WebKitGTK)
        if: needs.changes.outputs.code != 'false' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Unprivileged user namespaces (the sandbox's own network)
        if: needs.changes.outputs.code != 'false' && (runner.os == 'Linux')
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: cargo-mutants, at a pinned version
        if: needs.changes.outputs.code != 'false'
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: This shard of the diff's mutants
        if: needs.changes.outputs.code != 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          git diff "$BASE...$HEAD" > mutants.diff
          code=0
          # In place: a copy of the tree under the runner's temp folder
          # gives the daemon tests socket paths too long to bind (macOS).
          cargo mutants --in-place --in-diff mutants.diff --shard "$SHARD/4" --output mutants.out || code=$?
          # 2: a mutant was missed; 3: one timed out; 4: one did not build.
          # The report job weighs those across the platforms; anything
          # else is an error of this job's own.
          case $code in 0|2|3|4) ;; *) exit "$code" ;; esac
          # A diff with nothing to mutate still reports, as no mutants.
          mkdir -p mutants.out/mutants.out
          [ -f mutants.out/mutants.out/outcomes.json ] || echo '{"outcomes": []}' > mutants.out/mutants.out/outcomes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          name: mutants-${{ matrix.os }}-${{ matrix.shard }}
          path: mutants.out/mutants.out/outcomes.json
          if-no-files-found: error
          retention-days: 7

  # The mutation score, and the mutants missed on every platform (red).
  # Required: it reports under its own name for a documentation-only
  # change too, with its steps skipped.
  mutants-report:
    needs: [changes, mutants]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: mutants-*
          path: shards
      - name: Join the shards (scripts/mutants-report.py)
        if: needs.changes.outputs.code != 'false'
        env:
          MUTANTS: ${{ needs.mutants.result }}
        run: |
          if [ "$MUTANTS" != success ]; then
            echo "the mutants jobs did not all succeed: $MUTANTS"
            exit 1
          fi
          python3 -I scripts/mutants-report.py --self-test
          python3 -I scripts/mutants-report.py shards

  # The Windows sandbox, required: windows-latest is Windows Server, whose
  # process container cannot hide a path or open the way to a folder
  # without its contents, so there the container tests skip. windows-11-arm
  # is a Windows 11 client; x86_64 runs there under Windows's own x64
  # emulation. A skip here is a failure (KULE_TEST_REQUIRE_SANDBOX). The
  # runner's account is an administrator; the standard-user runs stay on
  # the Windows test machine.
  windows-sandbox:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.os == 'windows-latest' || inputs.os == 'all') }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-pc-windows-msvc, x86_64-pc-windows-msvc]
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml) and the target
        if: needs.changes.outputs.code != 'false'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # The helper programs the tests start beside themselves: the proxy
      # in its app container, the terminal's pseudo console in the command's;
      # the key to the secrets in the Credential Manager, required as well.
      - name: Commands, the proxy and the terminal run in their containers (the sandbox required)
        if: needs.changes.outputs.code != 'false'
        shell: bash
        env:
          KULE_TEST_REQUIRE_SANDBOX: "1"
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          cargo build --locked --target "$TARGET" -p kule-proxy -p kule-pty-helper
          cargo test --locked --target "$TARGET" -p kule-engine --test sandbox_windows --test terminal_windows
          cargo test --locked --target "$TARGET" -p kule-engine --lib sealing
          cargo test --locked --target "$TARGET" -p kule-proxy --test container
          cargo test --locked --target "$TARGET" -p kule-desktop pty

  # A scheduled run that failed is told where the maintainer looks: an
  # issue labelled `scheduled-ci`, one open at a time, with a comment per
  # later failure. Nothing of the event is templated into the script.
  report:
    needs: [changes, deny, workflows, test, windows-sandbox]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open the issue, or add to the one already open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ toJSON(needs) }}
        run: |
          set -eu
          jobs=$(printf '%s' "$FAILED" | jq -r 'to_entries[] | select(.value.result == "failure") | .key' | paste -sd ', ' -)
          body=$(printf 'The weekly run of ci.yml on main failed, with nothing committed: %s\n\nFailed: %s\n\nMAINTAINING.md says what to look at: a runner image that moved to a new OS release, a dependency that no longer builds, or a check whose tool changed.' "$RUN_URL" "$jobs")
          open=$(gh issue list --repo "$REPO" --label scheduled-ci --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label scheduled-ci --title "Scheduled CI failed on main" --body "$body"
          fi
