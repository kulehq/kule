# cargo deny: what Kule depends on, checked in CI (see .github/workflows/ci.yml).
# Advisories fail the build; each exception below says why it is one.

[graph]
all-features = true

[advisories]
# Unmaintained crates under Kule's Linux stack, none with a known
# vulnerability. zbus's D-Bus types sit under Secret Service (keyring, which
# keeps the key to the secrets) and the desktop's notifications; GTK 3's
# macros under Tauri. Revisit when keyring, notify-rust or Tauri move on.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro of glib 0.18, pulled in by Tauri's GTK 3 stack" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: D-Bus types of zbus, through keyring's Secret Service and notify-rust on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: D-Bus names of zbus, through keyring's Secret Service and notify-rust on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: macros of zvariant, through keyring's Secret Service and notify-rust on Linux" },
]
yanked = "deny"

[licenses]
# Permissive licences, and MPL-2.0 (file-level copyleft), all of which
# Kule's Apache-2.0 can ship with.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

# Lonca's object store: Apache-2.0 as the whole Lonca repository is (its
# LICENSE), though this crate's manifest does not say so yet.
[[licenses.clarify]]
crate = "lonca-core"
expression = "Apache-2.0"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io, and Lonca's network crate pinned to a commit.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/selcukgural/lonca"]
