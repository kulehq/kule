[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-preview.12"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kulehq/kule"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cedar-policy = "4.13.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
filetime = "0.2.29"
# Same version as Lonca, so the two can share code later; Kule adds
# `excludes` to read the workspace's ignore rules.
gix = { version = "0.90.0", default-features = false, features = ["max-performance", "revision", "index", "sha1", "excludes"] }
reflink-copy = "0.1.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2"
walkdir = "2.5.0"

# Dependencies without debug info: on macOS a debug build keeps it in
# separate object files that cargo never removes, and with cedar, gix,
# tree-sitter and tauri they grew target/debug past 60 GB. Kule's own
# crates keep full debug info.
[profile.dev.package."*"]
debug = false
