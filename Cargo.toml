[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kulehq/kule"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cedar-policy = "4.13.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
filetime = "0.2.29"
# Same version and features as Lonca, so the two can share code later.
gix = { version = "0.89.0", default-features = false, features = ["max-performance-safe", "revision", "index", "sha1"] }
reflink-copy = "0.1.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2"
walkdir = "2.5.0"
