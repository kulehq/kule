[package]
name = "kule-desktop"
description = "Kule's desktop app: tasks, the agent's live stream, the approval inbox and the timeline"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kule-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
futures = "0.3.34"
kule-acp = { version = "0.0.1", path = "../kule-acp" }
kule-engine = { version = "0.0.1", path = "../kule-engine" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true
