[package]
name = "kule-desktop"
description = "Kule's desktop app: tasks, the agent's live stream, the approval inbox and the timeline"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kule-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22.1"
kule-daemon = { version = "0.2.0", path = "../kule-daemon" }
libc = "0.2.190"
portable-pty = "0.9.0"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.4.0"

[dev-dependencies]
tempfile.workspace = true
