[package]
name = "kule-desktop"
description = "Kule's desktop app: tasks, the agent's live stream, the approval inbox and the timeline"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kule-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22.1"
kule-daemon = { version = "0.2.0-preview.4", path = "../kule-daemon" }
kule-ext = { version = "0.2.0-preview.4", path = "../kule-ext" }
ureq = "3.4.2"
libc = "0.2.190"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
# To turn WebRTC off in the window (see extensions::no_webrtc).
objc2 = "0.6.5"
# The font families installed, for Settings → Appearance (see fonts.rs).
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontManager"] }

[dev-dependencies]
tempfile.workspace = true
