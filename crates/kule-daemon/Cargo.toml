[package]
name = "kule-daemon"
description = "Kule's daemon: the engine, agent runs and approvals behind a Unix socket, for the app and the CLI"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
futures = "0.3.34"
kule-acp = { version = "0.2.0-preview.14", path = "../kule-acp" }
kule-engine = { version = "0.2.0-preview.14", path = "../kule-engine" }
kule-ext = { version = "0.2.0-preview.14", path = "../kule-ext" }
kule-view = { version = "0.2.0-preview.14", path = "../kule-view" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# Named pipes with an owner-only access list, and who is on the other end.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
