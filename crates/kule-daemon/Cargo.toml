[package]
name = "kule-daemon"
description = "Kule's daemon: the engine, agent runs and approvals behind a Unix socket, for the app and the CLI"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures = "0.3.34"
kule-acp = { version = "0.0.1", path = "../kule-acp" }
kule-engine = { version = "0.0.1", path = "../kule-engine" }
libc = "0.2.190"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true
