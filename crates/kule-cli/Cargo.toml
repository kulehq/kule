[package]
name = "kule"
description = "A control room for AI agents that work on your files: every command runs as a transaction in a sandboxed copy-on-write copy of the folder, judged by policy before it reaches the folder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["agents", "sandbox", "transactions", "policy", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kule"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
kule-engine = { version = "0.2.0-preview.17", path = "../kule-engine" }
kule-ext = { version = "0.2.0-preview.17", path = "../kule-ext" }
serde.workspace = true
serde_json.workspace = true
futures = "0.3.34"
kule-acp = { version = "0.2.0-preview.17", path = "../kule-acp" }
kule-daemon = { version = "0.2.0-preview.17", path = "../kule-daemon" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# Turns the console's echo off while a secret is typed.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Console"] }
