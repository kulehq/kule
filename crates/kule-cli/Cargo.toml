[package]
name = "kule"
description = "A control room for coding agents: every command runs as a transaction in a sandboxed copy-on-write copy, judged by policy before it reaches the workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["agents", "sandbox", "transactions", "policy", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kule"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
kule-engine = { version = "0.0.1", path = "../kule-engine" }
serde_json.workspace = true
futures = "0.3.34"
kule-acp = { version = "0.0.1", path = "../kule-acp" }
kule-daemon = { version = "0.0.1", path = "../kule-daemon" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
