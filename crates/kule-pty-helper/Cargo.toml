[package]
name = "kule-pty-helper"
description = "Kule's terminal helper: a pseudo console inside a task's container on Windows, and the frames Kule sends it"
# Shipped beside kule.exe; nothing to publish on its own.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kule-pty-helper"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# The pseudo console, its pipes and the shell started on it.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
