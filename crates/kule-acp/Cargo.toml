[package]
name = "kule-acp"
description = "Kule's ACP client: runs an agent in the sandbox and turns what it says into events"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The tokens of a turn, at its end, are still marked unstable in ACP; an
# agent that sends something else is read as sending nothing.
agent-client-protocol = { version = "3.4.0", features = ["stdio", "unstable_end_turn_token_usage"] }
async-process = "2.5.0"
blake3.workspace = true
futures = "0.3.34"
kule-engine = { version = "0.2.0-preview.13", path = "../kule-engine" }
kule-ext = { version = "0.2.0-preview.13", path = "../kule-ext" }
libc = "0.2.190"
serde.workspace = true
serde_json.workspace = true
toml = "1.1.8"
ureq = "3.4.2"
toml_edit = { version = "0.25.17", features = ["serde"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile.workspace = true
