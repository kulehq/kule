[package]
name = "kule-acp"
description = "Kule's ACP client: runs a coding agent in the sandbox and turns what it says into events"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
agent-client-protocol = { version = "3.4.0", features = ["stdio"] }
async-process = "2.5.0"
futures = "0.3.34"
kule-engine = { version = "0.0.1", path = "../kule-engine" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tempfile.workspace = true
