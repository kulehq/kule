[package]
name = "kule-view"
description = "Kule's file views: what a file of a task's copy looks like in the window, from its bytes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
imagesize = "0.15.0"
quick-xml = "0.42.0"
serde.workspace = true
serde_json.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
