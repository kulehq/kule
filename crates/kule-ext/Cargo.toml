[package]
name = "kule-ext"
description = "Kule's extensions: the manifest, the .kulext package, and the person's installed and approved extensions"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# Tells where an opened file really is, so a link on the way is noticed.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
