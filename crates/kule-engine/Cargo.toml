[package]
name = "kule-engine"
description = "Kule's transactional engine: copy-on-write task copies, effect sets, commit, rollback and undo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
blake3.workspace = true
cedar-policy.workspace = true
filetime.workspace = true
gix.workspace = true
imagesize = "0.15.0"
kule-entities = { version = "0.0.1", path = "../kule-entities" }
libc = "0.2.190"
# Shared with Lonca. Builds use the pinned commit; a crates.io publish uses
# the version, so that version has to be on crates.io first.
lonca-net = { version = "0.1.2", git = "https://github.com/selcukgural/lonca", rev = "da2011641edb25e27d03b4063686ce3450112957" }
# Checkpoints and their signed history live in Lonca's object store. Not on
# crates.io yet, so for now this keeps kule-engine from being published.
lonca-core = { git = "https://github.com/selcukgural/lonca", rev = "da2011641edb25e27d03b4063686ce3450112957" }
reflink-copy.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = "2.7.0"
thiserror.workspace = true
walkdir.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
webpki-roots = "1.0.9"
time = "0.3.55"

[dev-dependencies]
filetime.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
