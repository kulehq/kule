[package]
name = "kule-engine"
description = "Kule's transactional engine: copy-on-write task copies, effect sets, commit, rollback and undo"
# lonca-core is not on crates.io yet (see below).
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
blake3.workspace = true
cedar-policy.workspace = true
filetime.workspace = true
gix.workspace = true
kule-entities = { version = "0.2.0-preview.13", path = "../kule-entities" }
kule-view = { version = "0.2.0-preview.13", path = "../kule-view" }
libc = "0.2.190"
# Shared with Lonca. Builds use the pinned commit; a crates.io publish uses
# the version, so that version has to be on crates.io first.
lonca-net = { version = "0.1.2", git = "https://github.com/selcukgural/lonca", rev = "bf7a03962d16601e07727819d5c80dc085a093b0" }
# Checkpoints and their signed history live in Lonca's object store. Not on
# crates.io yet, so for now this keeps kule-engine from being published.
lonca-core = { git = "https://github.com/selcukgural/lonca", rev = "bf7a03962d16601e07727819d5c80dc085a093b0" }
reflink-copy.workspace = true
# Seals the secrets' values; the key lives in the system's keychain (macOS)
# or Secret Service (Linux, through zbus).
ring = "0.17.14"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "async-secret-service", "async-io", "crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
similar = "2.7.0"
# Folds names as a case-insensitive disk reads them (see policy.rs).
unicode-normalization = "0.1.25"
thiserror.workspace = true
walkdir.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
webpki-roots = "1.0.10"
time = "0.3.55"

[build-dependencies]
# macOS: compiles listeners.c, which reads listening sockets with libproc.
cc = "1.8.0"

[dev-dependencies]
filetime.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
