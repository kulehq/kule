[package]
name = "kule-engine"
description = "Kule's transactional engine: copy-on-write task copies, effect sets, commit, rollback and undo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
cedar-policy.workspace = true
filetime.workspace = true
gix.workspace = true
# Shared with Lonca. Builds use the pinned commit; a crates.io publish uses
# the version, so lonca-net 0.1.0 has to be published first.
lonca-net = { version = "0.1.0", git = "https://github.com/selcukgural/lonca", rev = "5ce1f1f5d7c81b055e4c0225997692d7de0fca33" }
reflink-copy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[dev-dependencies]
filetime.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
