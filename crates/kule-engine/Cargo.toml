[package]
name = "kule-engine"
description = "Kule's transactional engine: copy-on-write task copies, effect sets, commit, rollback and undo"
# lonca-core is not on crates.io yet (see below).
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
blake3.workspace = true
cedar-policy.workspace = true
filetime.workspace = true
gix.workspace = true
kule-entities = { version = "0.2.0-preview.20", path = "../kule-entities" }
kule-view = { version = "0.2.0-preview.20", path = "../kule-view" }
# Shared with Lonca. Builds use the pinned commit; a crates.io publish uses
# the version, so that version has to be on crates.io first.
lonca-net = { version = "0.1.2", git = "https://github.com/selcukgural/lonca", rev = "bf7a03962d16601e07727819d5c80dc085a093b0" }
# Checkpoints and their signed history live in Lonca's object store. Not on
# crates.io yet, so for now this keeps kule-engine from being published.
lonca-core = { git = "https://github.com/selcukgural/lonca", rev = "bf7a03962d16601e07727819d5c80dc085a093b0" }
reflink-copy.workspace = true
# Seals the secrets' values; the key lives in the system's keychain (macOS),
# Secret Service (Linux, through zbus) or the Credential Manager (Windows).
ring = "0.17.14"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
toml = "1.1.8"
similar = "2.7.0"
# Folds names as a case-insensitive disk reads them (see policy.rs).
unicode-normalization = "0.1.25"
thiserror.workspace = true
walkdir.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
webpki-roots = "1.0.10"
time = "0.3.55"

[build-dependencies]
# macOS: compiles listeners.c, which reads listening sockets with libproc.
cc = "1.8.0"

[dev-dependencies]
filetime.workspace = true
tempfile.workspace = true
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[target.'cfg(windows)'.dependencies]
# The sandbox around a task's commands: Microsoft's process container
# (`docs/windows-measurements.md`). Pinned: what it holds was measured at
# this version. No features: the micro-VM backend's build step downloads
# binaries, and the others are not Kule's.
mxc-sdk = { version = "=1.0.1", default-features = false }
# The frames a terminal's helper reads (the helper itself ships beside
# Kule's programs).
kule-pty-helper = { version = "0.2.0-preview.20", path = "../kule-pty-helper" }
# Handle-relative file calls (no link followed on the way), access lists,
# locks and process queries; the proxy's app container, its pipes and the
# job around it; the certificates the system trusts; the Windows build,
# the session and the window station the sandbox needs.
windows = { version = "0.62.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
